<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Washi paper laid flat -->
    <rect x="4" y="50" width="72" height="20" rx="1"/>
    <!-- Wide brush head (刷毛: horse-tail hair, wide and flat) -->
    <rect x="18" y="34" width="36" height="10" rx="2"/>
    <!-- Bristle tips (馬毛の毛先) -->
    <line x1="24" y1="44" x2="24" y2="50"/>
    <line x1="32" y1="44" x2="32" y2="50"/>
    <line x1="40" y1="44" x2="40" y2="50"/>
    <line x1="48" y1="44" x2="48" y2="50"/>
    <!-- Flat wooden handle (板状の柄) -->
    <rect x="30" y="12" width="12" height="22" rx="2"/>
    <!-- Wet trail on paper (どうさの跡) -->
    <line x1="8" y1="58" x2="24" y2="58" stroke-opacity="0.3"/>
  </g>
</svg>
