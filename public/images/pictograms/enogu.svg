<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Mortar (乳鉢: wider at top, narrower at base) -->
    <path d="M22,60 L14,30 L48,30 L40,60"/>
    <line x1="22" y1="60" x2="40" y2="60"/>
    <!-- Pestle (乳棒: grinding end inside mortar, handle extending out) -->
    <line x1="34" y1="48" x2="62" y2="14"/>
    <circle cx="32" cy="50" r="3.5"/>
    <!-- Pigment dish (絵皿 with pigment) -->
    <ellipse cx="64" cy="52" rx="10" ry="5"/>
    <path d="M54,52 Q64,64 74,52"/>
  </g>
  <!-- Pigment in dish -->
  <circle cx="64" cy="51" r="3.5" fill="#1a1a1a" stroke="none"/>
</svg>
