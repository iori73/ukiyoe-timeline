<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Woodblock (版木) -->
    <rect x="8" y="44" width="52" height="24" rx="2"/>
    <!-- Cleared surface lines (さらい跡) -->
    <line x1="14" y1="54" x2="32" y2="54"/>
    <line x1="14" y1="60" x2="28" y2="60"/>
    <!-- Flat chisel blade (平のみ: wide flat rectangle) -->
    <rect x="32" y="40" width="16" height="8" rx="1"/>
    <!-- Long straight handle (直線的な木の柄) -->
    <line x1="48" y1="42" x2="72" y2="18"/>
    <line x1="48" y1="46" x2="72" y2="22"/>
    <line x1="72" y1="18" x2="72" y2="22"/>
    <!-- Wood chip -->
    <path d="M18,44 L22,36 L26,44"/>
  </g>
</svg>
