<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Stack of handmade washi (越前生漉奉書紙) -->
    <!-- Bottom sheet -->
    <rect x="10" y="30" width="46" height="34" rx="1"/>
    <!-- Middle sheet -->
    <rect x="15" y="25" width="46" height="34" rx="1"/>
    <!-- Top sheet -->
    <rect x="20" y="20" width="46" height="34" rx="1"/>
    <!-- Deckle edge (手漉きの耳: irregular handmade paper edge) -->
    <path d="M20,54 Q25,52 30,54 Q35,56 40,54 Q45,52 50,54"/>
    <!-- Screen marks (漉き簀の目: subtle horizontal lines) -->
    <line x1="26" y1="30" x2="60" y2="30" stroke-opacity="0.2"/>
    <line x1="26" y1="38" x2="60" y2="38" stroke-opacity="0.2"/>
    <line x1="26" y1="46" x2="60" y2="46" stroke-opacity="0.2"/>
  </g>
</svg>
